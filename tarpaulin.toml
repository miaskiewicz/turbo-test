# Line-coverage gate for the turbo-test Rust crate (the runner, the launcher/CLI, the
# Node-API host, transforms, coverage reporting and the milestone spike binaries).
# Run: `cargo tarpaulin` (reads this file). CI: the `coverage` job in .github/workflows/ci.yml.
#
# Many tests drive the real CLI as a subprocess (tests/cli_*.rs spawn
# CARGO_BIN_EXE_turbo-test against fixture projects). Those child processes are built
# with the same LLVM instrumentation and write their own .profraw files; `objects` makes
# tarpaulin load the coverage maps of those executables so bin-only code is attributed.
#
# The gate measures production code only: the #[path] unit-test modules under src/ are
# excluded. In 0.8.2: 14804/14817 lines (99.91%) are covered. The 13 uncovered lines are
# defensive early-returns the #294 cc-7 refactor exposed (each extracted helper's OOM /
# API-shape guard occupies its own unreachable branch); v0.8.2 (turbo-test#306) collapses
# the V8 string-alloc OOM pattern through a `v8_str!` macro (one call site = one line
# tarpaulin counts against the outer happy path) and flattens the chai-load, head.rfind,
# real_esm_eligible and coverage-JSON-shape guards into if-let / method-chain forms, which
# removes most of the 27 uncovered lines v0.8.1 had. What remains:
# - cli.rs tap_flatten's `TapNode::Failed` arm: a file that did not load is a top-level TAP node
#   (render_tap), never a describe's child, but the match over the enum must name it;
# - runner.rs resolve_callback's lazy `load_cjs` of an app module the module runner transforms:
#   load_graph already loads every static import of a module (load_dep) before it links, so the
#   lookup above it finds the module loaded; no known input reaches it (turbo-test#194's setup
#   bundle, fixed, does not either: its mocked import is preloaded too).
# - runner.rs run_prepass_wrapper's Script::compile-chain and prepass_build_require early
#   returns: a user prepass whose wrapper source fails to compile / run or whose __mkRequire
#   is missing — reachable in principle but no fixture exercises them.
# - runner.rs real_esm_for's `real_esm` cache hit: the eligible-referrer path loads fresh each
#   test, so the second-hit branch is not hit by the current fixtures.
# - runner.rs `collect_variant_names`'s Variant::Star | Variant::Node match arm: tests exercise
#   Variant::Ns; the other kinds are produced by the loader's query-suffix path (?__tt_star /
#   ?__tt_node) which the current suites do not reach there.
# - runner.rs register_mock_cjs_override's non-object guard: `existing` is always an Object in
#   practice (every CJS exports value is), but to_object's refinement must still cover None.
[turbo-test]
engine = "Llvm"
target-dir = "target/cov"
skip-clean = true
timeout = "600s"
objects = [
    "target/cov/debug/turbo-test",
    "target/cov/debug/m0-spike",
    "target/cov/debug/m1-esm",
    "target/cov/debug/m1-cjs",
    "target/cov/debug/m1-transform",
    "target/cov/debug/m5-affected",
]
out = ["Stdout", "Json"]
output-dir = "target/cov/report"
fail-under = 99.9
exclude-files = ["src/*_tests.rs", "src/runner_tests_*.rs", "src/bin/spike_tests/*"]
