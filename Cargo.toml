[package]
name = "turbo-test"
version = "0.4.6"
edition = "2021"
license = "MIT"
description = "A blazing-fast native test runner — drop-in replacement for Vitest"

[[bin]]
name = "m0-spike"
path = "src/bin/m0_spike.rs"

[[bin]]
name = "m1-esm"
path = "src/bin/m1_esm.rs"

[[bin]]
name = "m1-cjs"
path = "src/bin/m1_cjs.rs"

[[bin]]
name = "m1-transform"
path = "src/bin/m1_transform.rs"

[[bin]]
name = "turbo-test"
path = "src/bin/turbo_test.rs"

[[bin]]
name = "m5-affected"
path = "src/bin/m5_affected.rs"

[dependencies]
url = "2.5"
v8 = "149.3.0"
oxc_allocator = "0.134"
oxc_parser = "0.134"
oxc_span = "0.134"
oxc_ast = "0.134"
oxc_ast_visit = "0.134"
oxc_codegen = "0.134"
oxc_sourcemap = "7"
oxc_transformer = "0.134"
oxc_semantic = "0.134"
oxc_resolver = "11.21.0"
libloading = "0.9.0"
serde_json = "1"
base64 = "0.22"
# CSS Syntax, selector and declaration validation for the DOM's CSSOM facade.
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
cssparser = "0.37"
# Public native rtdom API only. The immutable development revision supplies custom
# state selectors, bounded storage accounting and actual-context fragments;
# no registry release is implied.
# Keep the existing turbo_dom_parser import name through the package alias.
turbo-dom-parser = { package = "turbo-dom", version = "0.5.7", git = "https://github.com/miaskiewicz/turbo-dom", rev = "aaeb290c4fea12a1ed98185f1d0628758da53db1" }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
sha2 = "0.10"

[patch.crates-io]
v8 = { path = "vendor/rusty_v8" }
