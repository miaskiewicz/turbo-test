[package]
name = "turbo-test"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "A blazing-fast native test runner — drop-in replacement for Vitest"

[[bin]]
name = "m0-spike"
path = "src/bin/m0_spike.rs"

[[bin]]
name = "m1-esm"
path = "src/bin/m1_esm.rs"

[[bin]]
name = "m1-cjs"
path = "src/bin/m1_cjs.rs"

[[bin]]
name = "m1-transform"
path = "src/bin/m1_transform.rs"

[[bin]]
name = "turbo-test"
path = "src/bin/turbo_test.rs"

[[bin]]
name = "m5-affected"
path = "src/bin/m5_affected.rs"

[dependencies]
# V8 bindings for the runner, the Node-API host and the module loader: turbo-dom's
# rusty_v8 fork (the interceptor ShouldThrowOnError fix). `~150.4` admits fork patch
# releases only and must resolve to the same single turbo-dom-v8 that
# turbo-dom-browser-env links (scripts/check-single-v8.sh).
v8 = { package = "turbo-dom-v8", version = "~150.4" }
# The browser environment (window, document, CSSOM, forms, events) the runner
# installs into each test context.
turbo-dom-browser-env = { version = "0.6.0" }
oxc_allocator = "0.134"
oxc_parser = "0.134"
oxc_span = "0.134"
oxc_ast = "0.134"
oxc_ast_visit = "0.134"
oxc_codegen = "0.134"
oxc_sourcemap = "7"
oxc_transformer = "0.134"
oxc_semantic = "0.134"
oxc_resolver = "11.21.0"
libloading = "0.9.0"
serde_json = "1"
# local time for the human reporters' `Start at` (vitest's toTimeString)
libc = "0.2"
base64 = "0.22"

# `cargo tarpaulin` builds with `--cfg tarpaulin` (napi_host's coverage flush before an abort).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Pre-publish only (turbo-dom consolidation): resolve the unreleased turbo-dom crates
# from git. turbo-dom and turbo-dom-browser-env come from the refactor branch of
# miaskiewicz/turbo-dom; turbo-dom-v8 is generated there and pushed to the orphan
# candidate branch consolidation/turbo-dom-v8-candidate. Remove this whole section
# and re-lock (`cargo update -p turbo-dom -p turbo-dom-browser-env -p turbo-dom-v8`)
# once those versions are on crates.io, before tagging (RELEASING.md).
[patch.crates-io]
turbo-dom = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "4c473ef947f9031120ff10ec4c7cc0a6e906ec85" }
turbo-dom-browser-env = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "4c473ef947f9031120ff10ec4c7cc0a6e906ec85" }
turbo-dom-v8 = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "e9b36c8733ef1cf1073f7053a8c5931381c978c5" }
