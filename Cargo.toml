[package]
name = "turbo-test"
version = "0.8.4"
edition = "2021"
license = "MIT"
description = "A blazing-fast native test runner — drop-in replacement for Vitest"

[[bin]]
name = "m0-spike"
path = "src/bin/m0_spike.rs"

[[bin]]
name = "m1-esm"
path = "src/bin/m1_esm.rs"

[[bin]]
name = "m1-cjs"
path = "src/bin/m1_cjs.rs"

[[bin]]
name = "m1-transform"
path = "src/bin/m1_transform.rs"

[[bin]]
name = "turbo-test"
path = "src/bin/turbo_test.rs"

[[bin]]
name = "m5-affected"
path = "src/bin/m5_affected.rs"

[dependencies]
# V8 bindings for the runner, the Node-API host and the module loader: turbo-dom's
# rusty_v8 fork (the interceptor ShouldThrowOnError fix). `~150.4` admits fork patch
# releases only and must resolve to the same single turbo-dom-v8 that
# turbo-dom-browser-env links (scripts/check-single-v8.sh).
v8 = { package = "turbo-dom-v8", version = "~150.4" }
# The browser environment (window, document, CSSOM, forms, events) the runner
# installs into each test context.
turbo-dom-browser-env = "=0.8.4"
oxc_allocator = "0.134"
oxc_parser = "0.134"
oxc_span = "0.134"
oxc_ast = "0.134"
oxc_ast_visit = "0.134"
oxc_codegen = "0.134"
oxc_sourcemap = "7"
oxc_transformer = "0.134"
oxc_semantic = "0.134"
oxc_resolver = "11.21.0"
libloading = "0.9.0"
serde_json = "1"
# local time for the human reporters' `Start at` (vitest's toTimeString)
libc = "0.2"
# js-tokens' identifier classes, for vitest's code-frame highlighting
unicode-id-start = "1.4"
base64 = "0.22"
sha2 = "0.10.9"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8", "pem"] }
getrandom = "0.2.17"
flate2 = "1"
# TextDecoder's legacy encodings (Shift_JIS, UTF-16, windows-125x, ...): the WHATWG Encoding
# Standard implementation (turbo-test#119)
encoding_rs = "0.8"
# rolldown's diagnostic renderer (its ariadne fork, the version vite 8's rolldown links): a TS /
# JSX module that does not transform fails with its report, as vite's oxc transform does
# (turbo-test#113)
ariadne = { package = "rolldown-ariadne", version = "=0.6.0" }
# UTS#46 ToASCII for the URL polyfill's host parse: `new URL('http://ü.com').host`
# must come back as `xn--tda.com` like Node/vitest (turbo-test#259).
idna = "1"
# jest `moduleNameMapper` keys are ECMAScript regexes, lookaround and backreferences included
# (turbo-test#335)
fancy-regex = "0.20"

# `cargo tarpaulin` builds with `--cfg tarpaulin` (napi_host's coverage flush before an abort).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[patch.crates-io]
turbo-dom = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "26272a83e8f8c1f335d9c615c942674b1de8ec1a" }
turbo-dom-layout = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "26272a83e8f8c1f335d9c615c942674b1de8ec1a" }
turbo-dom-browser-env = { git = "https://github.com/miaskiewicz/turbo-dom", rev = "26272a83e8f8c1f335d9c615c942674b1de8ec1a" }
